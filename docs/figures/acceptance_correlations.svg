<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" role="img" aria-labelledby="title description">
<title id="title">Reported 2022 correlations with driver acceptance</title>
<desc id="description">The largest positive correlations were satisfaction at 0.767 and trust at 0.731. Distraction perception was negative 0.279. These are associations, not effects.</desc>
<rect width="900" height="505" fill="#f8faf9"/>
<text x="22" y="40" fill="#173b4a" font-size="25" font-weight="700">What was associated with acceptance?</text>
<text x="22" y="69" fill="#526975" font-size="15">Pearson correlations reported in the BSc dissertation · N = 311</text>
<line x1="405" x2="405" y1="104" y2="462" stroke="#76919b" stroke-width="1.3"/>
<text x="22" y="133" font-size="15" fill="#243747">Satisfaction</text><rect x="405" y="119" width="284" height="20" rx="3" fill="#39687d"/><text x="697" y="134" text-anchor="start" fill="#253949" font-size="14">+0.767</text><text x="22" y="171" font-size="15" fill="#243747">Trust</text><rect x="405" y="157" width="270" height="20" rx="3" fill="#39687d"/><text x="683" y="172" text-anchor="start" fill="#253949" font-size="14">+0.731</text><text x="22" y="209" font-size="15" fill="#243747">Usefulness</text><rect x="405" y="195" width="255" height="20" rx="3" fill="#39687d"/><text x="668" y="210" text-anchor="start" fill="#253949" font-size="14">+0.690</text><text x="22" y="247" font-size="15" fill="#243747">Processing speed</text><rect x="405" y="233" width="254" height="20" rx="3" fill="#39687d"/><text x="667" y="248" text-anchor="start" fill="#253949" font-size="14">+0.687</text><text x="22" y="285" font-size="15" fill="#243747">Service/display quality</text><rect x="405" y="271" width="254" height="20" rx="3" fill="#39687d"/><text x="667" y="286" text-anchor="start" fill="#253949" font-size="14">+0.686</text><text x="22" y="323" font-size="15" fill="#243747">Ease of use</text><rect x="405" y="309" width="235" height="20" rx="3" fill="#39687d"/><text x="648" y="324" text-anchor="start" fill="#253949" font-size="14">+0.635</text><text x="22" y="361" font-size="15" fill="#243747">Locational accuracy</text><rect x="405" y="347" width="233" height="20" rx="3" fill="#39687d"/><text x="646" y="362" text-anchor="start" fill="#253949" font-size="14">+0.631</text><text x="22" y="399" font-size="15" fill="#243747">Social influence</text><rect x="405" y="385" width="182" height="20" rx="3" fill="#39687d"/><text x="595" y="400" text-anchor="start" fill="#253949" font-size="14">+0.493</text><text x="22" y="437" font-size="15" fill="#243747">Distraction perception</text><rect x="302" y="423" width="103" height="20" rx="3" fill="#a45d4c"/><text x="294" y="438" text-anchor="end" fill="#253949" font-size="14">-0.279</text>
<text x="22" y="485" font-size="13" fill="#526975">Reported 2022 associations; not evidence of causal effects or prevented accidents.</text>
</svg>